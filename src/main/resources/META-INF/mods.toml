modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL="https://www.curseforge.com/minecraft/mc-mods/stfu-reforged/" #optional
#logoFile="examplemod.png" #optional
credits="itsfelix5"
authors="${mod_authors}" #optional
description='''${mod_description}'''

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "stfu.mixins.json"

[[dependencies."${mod_id}"]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="yet_another_config_lib_v3" # yet another config lib
    mandatory=true
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="mixinbooster" # Mixin Booster
    mandatory=true
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"